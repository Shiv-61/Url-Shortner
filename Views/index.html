<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortner</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="../assets/url-favicon.png" type="image/x-icon" />
  </head>

  <body>
    <button id="theme" onclick="change_theme()">Theme</button>
    <main class="container">
      <h1 class="title">Url Shortner</h1>

      <form id="form" method="post" class="url-form">
        <input
          type="text"
          name="url"
          class="input-box"
          placeholder="Enter URL to be Shorten"
        />
        <input type="submit" value="Submit" class="submit-btn" />
      </form>

      <div class="result-section">
        <div class="div1">
          🔗The link will arrive here :
        </div>

        <input
          type="text"
          class="output-box"
          readonly
          placeholder="Shortened URL appears here"
          id="output"
        />

        <button
          onclick="copy_url()"
          class="copy-btn"
        >
          Copy
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
